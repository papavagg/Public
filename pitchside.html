    const maturity = clamp((p.age - 17) / 9, 0, 1);

        high: Math.round(clamp(p.potential + width / 2, floor, ceiling)),

                    const quality = (avgForm ? clamp((avgForm - 5.5) / 2.5, 0, 1) : 0.4) * 0.5
                        + startRate * 0.25 + trainingBonus * 0.25;

                const cost = facilityUpgradeCost(c, weakest);
                const cap = FACILITIES.find((f) => f.key === weakest)?.max ?? 10;
                if (c.facilities[weakest] >= cap || c.budget < cost)
                    return c;
                const facilities = { ...c.facilities, [weakest]: c.facilities[weakest] + 1 };
                const bump = weakest === "training" || weakest === "academy" ? randInt(0, 2) : 0;
                return {
                    ...c,
                    budget: c.budget - cost,
                    facilities,
                    defence: clamp(c.defence + bump, 20, 95),
                    midfield: clamp(c.midfield + bump, 20, 95),
                    attack: clamp(c.attack + bump, 20, 95),
                };
            });
            // Country coefficients move on how each association's clubs did.
            {
                const scored = { ...coefficients };
                for (const key of Object.keys(scored))
                    scored[key] *= 0.88; // rolling decay
                for (const e of played) {
                    const winner = nextClubs.find((c) => c.name === e.winner);
                    if (!winner)
                        continue;
                    const weight = e.key === "ucl" ? 6 : e.key === "uel" ? 3 : 1.5;
                    scored[winner.country] = (scored[winner.country] || 0) + weight;
                }
                for (const key of Object.keys(scored))
                    scored[key] = Number(scored[key].toFixed(3));
                nextCoefficients = scored;
            }
            // Promotion and relegation, then next season's European qualifiers.
            nextClubs = applyPromotionRelegation(nextClubs, news);
            nextQualifiers = assignEuropeanQualifiers(nextClubs);
            // Squads age a year: veterans retire, youth comes through, wages reset.
            const agedSquads = {};
            for (const c of nextClubs) {
                const squad = (squads[c.id] || []).map((sp) => {
                    const age = sp.age + 1;
                    let rating = sp.rating;
                    if (age <= 23 && rating < sp.potential && Math.random() < 0.45)
                        rating += randInt(1, 2);
                    else if (age >= 31 && Math.random() < 0.4)
                        rating -= randInt(1, 2);
                    rating = clamp(rating, 25, 95);
                    return { ...sp, age, rating, wage: calcWage(rating, age) };
                });
                // Retire the over-36s and replace them from the academy.
                const kept = squad.filter((sp) => sp.age <= 36);
                while (kept.length < SQUAD_SIZE) {
                    const position = SQUAD_SHAPE[kept.length % SQUAD_SHAPE.length];
                    const youth = makeSquadPlayer(nextSquadIdRef.current++, c, position, kept.length);
                    // A stronger academy produces better graduates.
                    const boost = Math.round((c.facilities.academy - 5) * 0.8);
                    kept.push({
                        ...youth,
                        rating: clamp(youth.rating + boost, 25, 95),
                        potentialCeiling: clamp(youth.potentialCeiling + boost, 25, 99),
                    });
                }
                agedSquads[c.id] = kept;
            }
            nextSquads = agedSquads;
            // A fresh intake arrives each summer, sized and graded by the academy.
            const freshAcademies = {};
            for (const c of nextClubs) {
                const kept = (nextAcademies[c.id] || [])
                    .filter((y) => y.age < 18)
                    .map((y) => ({ ...y, age: y.age + 1, rating: clamp(y.rating + randInt(1, 3), 20, 85) }));
                const target = clamp(3 + Math.round(c.facilities.academy / 2) + Math.round((c.facilities.youth ?? 5) / 3), 3, 11);
                while (kept.length < target) {
                    kept.push(makeAcademyPlayer(nextSquadIdRef.current++, c));
                }
                freshAcademies[c.id] = kept;
            }
            nextAcademies = freshAcademies;
            nextClubs = nextClubs.map((c) => ({
                ...c,
                ...blankRecord(),
                wageBill: wageBillOf(nextSquads[c.id] || []),
                staff: c.staff,
                staffBill: staffBillOf(c.staff),
            }));
            nextFixtures = buildSeasonFixtures(nextClubs);
            setSeason((s) => s + 1);
            news.unshift("The season has ended. A new campaign begins.");
        }
        /* ---------- 4. Courses & money ---------- */
        let repGain = 0;
        let nextActiveCourse = activeCourse;
        if (activeCourse) {
            const remaining = activeCourse.weeksRemaining - 1;
            if (remaining <= 0) {
                repGain = activeCourse.repGain;
                news.unshift(`Completed ${activeCourse.name} — reputation +${activeCourse.repGain}.`);
                setCompletedCourses((prev) => [...prev, activeCourse.id]);
                nextActiveCourse = null;
            }
            else {
                nextActiveCourse = { ...activeCourse, weeksRemaining: remaining };
            }
        }
        setPlayers(updated);
        setClubs(nextClubs);
        setFixtures(nextFixtures);
        setSquads(nextSquads);
        setAcademies(nextAcademies);
        setCoaches(nextCoaches);
        setRivals(nextRivals);
        setEuroResults(nextEuroResults);
        setQualifiers(nextQualifiers);
        setCoefficients(nextCoefficients);
        setResults(weekResults);
        setMoney((m) => m + commission + endorsementIncome + afterTax(dividends) - agencyCosts - loanPayments - scoutWages);
        setWeek(newWeek);
        setActiveCourse(nextActiveCourse);
        if (repGain !== 0 || repDelta !== 0)
            setReputation((r) => clamp(r + repGain + repDelta, 1, 100));
        if (commission > 0) {
            news.unshift(`Collected ${fmt(commission)} in wage commissions (after ${Math.round(AGENT_TAX_RATE * 100)}% tax on ${fmt(grossCommission)}).`);
        }
        news.push(`Paid ${fmt(agencyCosts)} in agency running costs.`);
        if (scoutWages > 0)
            news.push(`Scout wages cost ${fmt(scoutWages)}.`);
        if (loanPayments > 0)
            news.push(`Loan repayments took ${fmt(loanPayments)}.`);
        if (news.length === 0)
            news.push("A quiet week on the agency front.");
        setLog((prev) => [...news, ...prev].slice(0, 30));
        /*
         * Anything that needs a decision from you becomes an inbox message rather
         * than scrolling away in the news feed.
         */
        const urgent = news
            .filter((n) => /bid |transfer request|contract|expired|endorsement|offer|injur|administration|turned you down|8 weeks/i.test(n))
            .map((text, i) => ({
            id: `msg-${newWeek}-${i}`,
            week: newWeek,
            date: weekDate(newWeek).label,
            text,
            read: false,

        if (urgent.length)

        // Offline-first: every advanced week is written to disk automatically.
        setTimeout(() => saveGame(true), 0);

    function handleScout(player) {

        if (fee > money) {
            setScoutNotice({ type: "fail", message: `Scouting ${player.name} costs ${fmt(fee)}.` });
            return;
        }
        setMoney((m) => m - fee);
        setPlayers((prev) => prev.map((p) => (p.id === player.id ? { ...p, scouted: true } : p)));
        setScoutNotice({
            type: "success",

        });

    function handleEndorsement(player, accept) {
        if (!player.endorsementOffer)
            return;
        if (!accept) {
            setPlayers((prev) => prev.map((p) => (p.id === player.id ? { ...p, endorsementOffer: null } : p)));
            return;
        }
        // Your commission on endorsements is capped exactly as playing contracts are.
        const rate = tier.commissionCap;
        setPlayers((prev) => prev.map((p) => p.id === player.id
            ? { ...p, endorsement: p.endorsementOffer, endorsementOffer: null,
                endorsementRate: rate, morale: clamp(p.morale + 6, 1, 100) }
            : p));
        setContractNotice({

        });

    function handleRenegotiate(player) {
        const club = clubs.find((c) => c.name === player.club);
        if (!club)
            return;
        const marketWage = calcWage(player.rating, player.age);
        const askedWage = Math.round(marketWage * 1.25);
        const avgForm = player.form.length
            ? player.form.reduce((a, b) => a + b, 0) / player.form.length
            : 6;
        // A club only pays up for a player who is actually performing.
        let acceptChance = 0.25 + (avgForm - 6) * 0.35 + (player.rating - 60) / 200;
        if (player.contractWeeks < 12)
            acceptChance += 0.15; // pressure of an expiring deal
        if (upgrades.legal)
            acceptChance += 0.25;
        if (club.budget < askedWage * 60)
            acceptChance -= 0.3;
        acceptChance = clamp(acceptChance, 0.05, 0.92);
        if (Math.random() < acceptChance) {
            setPlayers((prev) => prev.map((p) => p.id === player.id
                ? { ...p, wage: askedWage, contractWeeks: CONTRACT_WEEKS, morale: clamp(p.morale + 12, 1, 100), wantsAway: false }
                : p));
            setReputation((r) => clamp(r + 1, 1, 100));
            setContractNotice({
                type: "success",
                message: `${club.name} agreed new terms for ${player.name}: ${fmt(askedWage)}/wk for another ${CONTRACT_WEEKS} weeks. Your cut rises with it.`,
            });
        }
        else {
            setPlayers((prev) => prev.map((p) => (p.id === player.id ? { ...p, morale: clamp(p.morale - 6, 1, 100) } : p)));
            setContractNotice({
                type: "fail",
                message: `${club.name} rejected new terms for ${player.name} — they don't rate his recent form at ${fmt(askedWage)}/wk. His morale has dipped.`,
            });
        }
    }

    /*
     * Anything that genuinely needs a decision halts a run. This is what lets

     * best client asks for a move.

    function findInterrupt() {
        if (transferOffers.length)
            return "You have transfer offers to answer.";
        if (myClub && (myClub.sponsorOffers || []).length)
            return "Sponsorship offers are on the table.";
        if (money < 0)
            return "You are overdrawn.";
        if (isDeadlineWeek(week))
            return "Deadline day — the window shuts this week.";
        for (const p of clients) {
            if (p.endorsementOffer)
                return `${p.name} has an endorsement offer waiting.`;
            if (p.wantsAway)
                return `${p.name} has asked to leave ${p.club}.`;
            if (p.contractWeeks > 0 && p.contractWeeks <= 4)
                return `${p.name}'s contract is nearly up.`;
            if (p.club === "Free Agent" && !p.retired)
                return `${p.name} is without a club.`;
            if ((p.morale ?? 70) <= 30)
                return `${p.name} is deeply unhappy.`;
        }
        return null;
    }

        }

    /* Bid for a player at another club, on your club's behalf. */
    function handleClubBid(target) {
        if (!myClub)
            return;
        if (!transferWin.open) {
            setClubNotice({ type: "fail", message: `The window is shut — it opens on ${nextWindowOpens(week)}.` });
            return;
        }
        if (myClub.transferBan > 0) {
            setClubNotice({ type: "fail", message: `${myClub.name} is serving an FFP transfer ban.` });
            return;
        }
        const squad = squads[myClub.id] || [];
        if (squad.length >= SQUAD_SIZE) {
            setClubNotice({ type: "fail", message: `Squad is full at ${SQUAD_SIZE} players.` });
            return;
        }
        const policy = myClub.wagePolicy || defaultWagePolicy(myClub);
        const wageRoom = policy.weeklyBudget - wageBillOf(squad);
        const askingWage = Math.round(target.player.wage * 1.15);
        if (askingWage > wageRoom) {
            setClubNotice({
                type: "fail",
                message: `${target.player.name} wants ${fmt(askingWage)}/wk and you only have ${fmt(Math.max(0, wageRoom))} of wage budget left. Raise the budget or move someone on.`,
            });
            return;
        }
        const value = calcMarketValue(target.player.rating, target.player.potential, target.player.age);
        // Your director negotiates the asking price down before you ever bid.
        const fee = Math.round(value * (target.player.listed ? 0.9 : 1.35) * tdBuyDiscount(myClub.technicalDirector));
        if (fee > myClub.budget) {
            setClubNotice({
                type: "fail",
                message: `${target.club.name} want ${fmt(fee)} and the club only has ${fmt(myClub.budget)}. Fund the club to go higher.`,
            });
            return;
        }
        // An unlisted player's club needs persuading; a listed one is available.
        const accept = target.player.listed || Math.random() < 0.55;
        if (!accept) {
            setClubNotice({
                type: "fail",
                message: `${target.club.name} rejected the bid — ${target.player.name} isn't for sale at ${fmt(fee)}.`,
            });
            return;
        }
        setClubs((prev) => prev.map((c) => {
            if (c.id === myClub.id)
                return { ...c, budget: c.budget - fee };
            if (c.id === target.club.id)
                return { ...c, budget: c.budget + fee };
            return c;
        }));
        setSquads((prev) => ({
            ...prev,
            [target.club.id]: (prev[target.club.id] || []).filter((sp) => sp.id !== target.player.id),
            [myClub.id]: [...(prev[myClub.id] || []), { ...target.player, wage: askingWage, listed: false }],
        }));
        setClubNotice({
            type: "success",
            message: `${target.player.name} signs for ${myClub.name} from ${target.club.name} for ${fmt(fee)} on ${fmt(askingWage)}/wk.`,
        });
    }
    /* ---------------------- recruiting for your own club ---------------------- */
    function openNegotiation(entry) {
        if (!myClub)
            return;
        const { player, club, kind } = entry;
        const value = calcMarketValue(player.rating, player.potential, player.age);
        if (kind === "free") {
            const terms = freeAgentTerms(player, myClub, 10);
            setNegotiation({ entry, kind, round: 0, ask: terms.total, offer: terms.total,
                wage: terms.wage, status: "open", terms });
            return;
        }
        if (kind === "loan") {
            const terms = loanTerms(player, club, myClub);
            setNegotiation({ entry, kind, round: 0, ask: terms.fee, offer: terms.fee,
                wage: terms.weeklyWage, status: "open", terms });
            return;
        }
        // A listed player still has an asking price, shaded by both directors.
        const ask = Math.round(value * 0.95 * tdSellPremium(club.technicalDirector) * tdBuyDiscount(myClub.technicalDirector));
        setNegotiation({ entry, kind, round: 0, ask, offer: Math.round(ask * 0.8),
            wage: Math.round(player.wage * 1.12), status: "open", terms: null });
    }
    /* The selling club answers: accept, come back with a number, or walk. */
    function submitOffer() {
        if (!negotiation || !myClub)
            return;
        const { entry, ask, offer, round } = negotiation;
        const gap = offer / ask;
        if (gap >= 0.98)
            return completeSigning(negotiation, offer);
        // The weaker their negotiator, the sooner they take less.
        const theirTD = entry.club?.technicalDirector;
        const stubbornness = theirTD ? clamp((theirTD.negotiation - 20) / 79, 0, 1) : 0.25;
        const acceptChance = clamp((gap - 0.72) * 3 - stubbornness * 0.35 - round * 0.05, 0.02, 0.95);
        if (Math.random() < acceptChance)
            return completeSigning(negotiation, offer);
        if (round >= 3) {
            setNegotiation({ ...negotiation, status: "failed" });
            setClubNotice({
                type: "fail",
                message: `${entry.club.name} have ended talks over ${entry.player.name}.`,
            });
            return;
        }
        // They counter somewhere between your bid and their valuation.
        const counter = Math.round(ask * (0.88 + stubbornness * 0.1) - (ask - offer) * 0.25);
        setNegotiation({
            ...negotiation,
            round: round + 1,
            ask: Math.max(counter, offer + 1),
            offer: Math.max(counter, offer + 1),
            status: "counter",
        });
    }
    function completeSigning(neg, fee) {
        const { entry, kind, wage, terms } = neg;
        const { player, club } = entry;
        const squad = squads[myClub.id] || [];
        if (squad.length >= SQUAD_SIZE) {
            setClubNotice({ type: "fail", message: `Squad is full at ${SQUAD_SIZE} players.` });
            return;
        }
        const policy = myClub.wagePolicy || defaultWagePolicy(myClub);
        if (wageBillOf(squad) + wage > policy.weeklyBudget) {
            setClubNotice({
                type: "fail",
                message: `That wage takes you past your ceiling of ${fmt(policy.weeklyBudget)}/wk.`,
            });
            return;
        }
        const outlay = kind === "free" ? terms.total : fee;
        if (myClub.budget < outlay) {
            setClubNotice({ type: "fail", message: `${myClub.name} can't cover ${fmt(outlay)}.` });
            return;
        }
        setClubs((prev) => prev.map((c) => {
            if (c.id === myClub.id)
                return { ...c, budget: c.budget - outlay };
            // Loans and frees carry no fee to the parent club.
            if (club && c.id === club.id && kind === "listed") {
                return { ...c, budget: c.budget + fee };
            }
            if (club && c.id === club.id && kind === "loan") {
                return { ...c, budget: c.budget + fee };
            }
            return c;
        }));
        const arriving = {
            ...player,
            wage,
            listed: false,
            loanListed: false,
            ...(kind === "loan" ? { loanedFrom: club.id, loanWeeksLeft: terms.weeks } : {}),
        };
        setSquads((prev) => {
            const next = { ...prev };
            if (club)
                next[club.id] = (next[club.id] || []).filter((sp) => sp.id !== player.id);
            next[myClub.id] = [...(next[myClub.id] || []), arriving];
            return next;
        });
        // A free agent leaves the open market for good.
        if (kind === "free") {
            setPlayers((prev) => prev.map((p) => (p.id === player.id ? { ...p, club: myClub.name, contractWeeks: CONTRACT_WEEKS, wage } : p)));
        }
        haptic([20, 40, 20]);
        setNegotiation(null);
        setClubNotice({
            type: "success",
            message: kind === "free"
                ? `${player.name} signs on a free — ${fmt(terms.signingBonus)} signing-on fee, ${fmt(wage)}/wk.`
                : kind === "loan"
                    ? `${player.name} joins on loan from ${club.name}. You cover ${fmt(wage)}/wk of his wages, they pay ${fmt(terms.parentPays)}.`
                    : `${player.name} signs from ${club.name} for ${fmt(fee)} on ${fmt(wage)}/wk.`,
        });
    }
    function handleHireTD(td) {
        if (!myClub)
            return;
        if (myClub.budget < td.wage * 52) {
            setClubNotice({
                type: "fail",
                message: `${myClub.name} can't cover ${td.name}'s wages of ${fmt(td.wage)}/wk.`,
            });
            return;
        }
        const outgoing = myClub.technicalDirector;
        setClubs((prev) => prev.map((c) => c.id === myClub.id ? { ...c, technicalDirector: { ...td, seasonsAtClub: 0 } } : c));
        setTdPool((prev) => {
            const without = prev.filter((x) => x.id !== td.id);
            return outgoing ? [...without, outgoing] : without;
        });
        setClubNotice({
            type: "success",
            message: `${td.name} appointed technical director${outgoing ? `, replacing ${outgoing.name}` : ""}. He'll negotiate ${Math.round((1 - tdBuyDiscount(td)) * 100)}% off incoming fees and ${Math.round((tdSellPremium(td) - 1) * 100)}% onto outgoing ones.`,
        });
    }
    function handleHireStaff(member) {
        if (!myClub)
            return;
        if (myClub.budget < member.wage * 26) {
            setClubNotice({ type: "fail", message: `${myClub.name} can't cover ${member.name}'s wages.` });
            return;
        }
        // The new man replaces whoever currently holds that role.
        const outgoing = myClub.staff.find((m) => m.role === member.role);
        setClubs((prev) => prev.map((c) => {
            if (c.id !== myClub.id)
                return c;
            const staff = outgoing
                ? c.staff.map((m) => (m.role === member.role ? member : m))
                : [...c.staff, member];
            return { ...c, staff, staffBill: staffBillOf(staff) };
        }));
        setStaffPool((prev) => {
            const without = prev.filter((m) => m.id !== member.id);
            return outgoing ? [...without, outgoing] : without;
        });
        setClubNotice({
            type: "success",
            message: `${member.name} appointed as ${member.role}${outgoing ? `, replacing ${outgoing.name}` : ""}.`,
        });
    }
    function handleHireCoach(coach) {
        if (!myClub)
            return;
        if (myClub.budget < coach.wage * 52) {
            setTradeResult({ type: "fail", message: `${myClub.name} can't cover ${coach.name}'s wages.` });
            return;
        }
        const outgoing = myClub.manager;
        setClubs((prev) => prev.map((c) => (c.id === myClub.id ? { ...c, manager: { ...coach, seasonsAtClub: 0 } } : c)));
        setCoaches((prev) => [...prev.filter((co) => co.id !== coach.id), { ...outgoing, seasonsAtClub: 0 }]);
        setTradeResult({
            type: "success",
            message: `${coach.name} appointed as manager of ${myClub.name}, replacing ${outgoing.name}.`,
        });
    }
    function handleUpgradeFacility(key) {
        if (!myClub)
            return;
        const cost = facilityUpgradeCost(myClub, key);
        const facilityDef = FACILITIES.find((f) => f.key === key);
        const ceiling = facilityDef ? facilityDef.max : 10;
        if (myClub.facilities[key] >= ceiling)
            return;
        if (myClub.budget < cost) {
            setTradeResult({ type: "fail", message: `${myClub.name} can't afford that — it costs ${fmt(cost)}.` });
            return;
        }
        const bump = key === "training" || key === "academy" ? randInt(0, 2) : 0;
        setClubs((prev) => prev.map((c) => c.id === myClub.id
            ? {
                ...c,
                budget: c.budget - cost,
                facilities: { ...c.facilities, [key]: c.facilities[key] + 1 },
                defence: clamp(c.defence + bump, 20, 95),
                midfield: clamp(c.midfield + bump, 20, 95),
                attack: clamp(c.attack + bump, 20, 95),
            }
            : c));
        const facility = FACILITIES.find((f) => f.key === key);
        setTradeResult({
            type: "success",
            message: `${facility.name} upgraded to level ${myClub.facilities[key] + 1} for ${fmt(cost)}.`,
        });
    }
    /* --------------------------- database export/import --------------------------- */
    /*
     * The whole game world as one JSON file. Export it, edit the club and
     * player names in any text editor or spreadsheet, and load it back in —
     * which is how you put real names into the game.
     */
    function exportDatabase() {
        const data = {
            version: 1,
            exportedAt: new Date().toISOString(),
            leagues: LEAGUES.map((l) => ({ name: l.name, country: l.country, teams: l.teams })),
            clubs: clubs.map((c) => ({
                id: c.id, name: c.name, league: c.league, country: c.country,
                reputation: c.reputation, defence: c.defence, midfield: c.midfield, attack: c.attack,
                budget: c.budget, facilities: c.facilities, ticketPrice: c.ticketPrice,
                manager: c.manager ? { name: c.manager.name, nationality: c.manager.nationality } : null,
            })),
            squads: Object.fromEntries(Object.entries(squads).map(([id, sq]) => [
                id,
                sq.map((p) => ({
                    id: p.id, name: p.name, nationality: p.nationality, position: p.position,
                    age: p.age, rating: p.rating, potential: p.potential, wage: p.wage,
                })),
            ])),
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `football-agent-database-${seasonLabel.replace("/", "-")}.json`;
        a.click();
        URL.revokeObjectURL(url);
        setSaveNotice({
            type: "success",
            message: "Database exported. Edit the names in the file and import it back to use them.",
        });
        setTimeout(() => setSaveNotice(null), 5000);
    }
    function importDatabase(file) {
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const data = JSON.parse(reader.result);
                if (!data.clubs)
                    throw new Error("no clubs");
                // Names and ratings are taken from the file; everything else in the
                // running game is preserved, so an edited file can be dropped into
                // a save in progress.
                const nameById = new Map(data.clubs.map((c) => [c.id, c]));
                setClubs((prev) => prev.map((c) => {
                    const edit = nameById.get(c.id);
                    if (!edit)
                        return c;
                    return {
                        ...c,
                        name: edit.name ?? c.name,
                        reputation: edit.reputation ?? c.reputation,
                        defence: edit.defence ?? c.defence,
                        midfield: edit.midfield ?? c.midfield,
                        attack: edit.attack ?? c.attack,
                        budget: edit.budget ?? c.budget,
                        facilities: edit.facilities ?? c.facilities,
                        manager: edit.manager && c.manager ? { ...c.manager, ...edit.manager } : c.manager,
                    };
                }));
                if (data.squads) {
                    setSquads((prev) => {
                        const next = { ...prev };
                        for (const [clubId, edits] of Object.entries(data.squads)) {
                            const existing = next[clubId];
                            if (!existing)
                                continue;
                            const byId = new Map(edits.map((e) => [e.id, e]));
                            next[clubId] = existing.map((sp) => {
                                const e = byId.get(sp.id);
                                return e ? { ...sp, ...e } : sp;
                            });
                        }
                        return next;
                    });
                }
                setSaveNotice({
                    type: "success",
                    message: `Imported ${data.clubs.length} clubs from your database file.`,
                });
            }
            catch {
                setSaveNotice({ type: "fail", message: "That file couldn't be read as a game database." });
            }
            setTimeout(() => setSaveNotice(null), 5000);
        };
        reader.readAsText(file);
    }
    /* ------------------------------ rewarded ads ------------------------------ */
    const rewardsLeft = Math.max(0, AD_DAILY_LIMIT - rewardsUsed);
    function grantReward(reward) {
        switch (reward.id) {
            case "cash": {
                const amount = rewardCashValue(weeklyNet);
                setMoney((m) => m + amount);
                setRewardNotice({ type: "success", message: `${fmt(amount)} added to your account.` });
                break;
            }
            case "scouting": {
                const target = freeAgents.find((p) => !p.scouted);
                if (!target) {
                    setRewardNotice({ type: "fail", message: "No unscouted free agents to report on right now." });
                    return false;
                }
                setPlayers((prev) => prev.map((p) => (p.id === target.id ? { ...p, scouted: true } : p)));
                setRewardNotice({
                    type: "success",
                    message: `Scouting report on ${target.name}: true potential ${target.potential}.`,
                });
                break;
            }
            case "leads": {
                const leads = [];
                for (let i = 0; i < 2; i++) {
                    leads.push({ ...makePlayer(nextIdRef.current++, homeCountry), exclusiveUntil: week + 3 });
                }
                setPlayers((prev) => [...prev, ...leads]);
                setRewardNotice({
                    type: "success",
                    message: `${leads.map((l) => l.name).join(" and ")} have come through your network, exclusive to you for 3 weeks.`,
                });
                break;
            }
            case "goodwill": {
                setPlayers((prev) => prev.map((p) => (p.isClient ? { ...p, morale: clamp((p.morale ?? 70) + 8, 1, 100) } : p)));
                setRewardNotice({ type: "success", message: "Your clients are feeling better about things." });
                break;
            }
            default:
                return false;
        }
        return true;
    }
    async function handleClaimReward(reward) {
        if (rewardsLeft <= 0) {
            setRewardNotice({ type: "fail", message: "No rewards left this week — they refresh when you advance." });
            return;
        }
        // Paying once removes the video entirely; the reward is granted directly.
        if (adsRemoved) {
            if (grantReward(reward)) {
                setRewardsUsed((n) => n + 1);
                haptic([15, 30, 15]);
            }
            return;
        }
        setWatchingAd(reward);
        setAdProgress(0);
        const completed = await showRewardedAd(setAdProgress);
        setWatchingAd(null);
        setAdProgress(0);
        if (!completed)
            return;
        if (grantReward(reward)) {
            setRewardsUsed((n) => n + 1);
            haptic([15, 30, 15]);
        }
    }
    function handleRemoveAds() {
        /*
         * INTEGRATION NOTE: this is where the store purchase goes — a
         * non-consumable IAP via @capacitor-community/in-app-purchases or
         * RevenueCat. Only set adsRemoved once the purchase is verified, and

         */
        setAdsRemoved(true);
        setRewardNotice({

            message: `Thank you. Rewards are now claimed instantly with no video, for good.`,
        });

    /* --------------------------------- bank --------------------------------- */
    function handleTakeLoan(country) {
        const amount = Math.max(1000, Math.round(loanAmount));
        if (amount > creditLimit) {
            setBankNotice({
                type: "fail",
                message: `The bank will only lend you ${fmt(creditLimit)} at your standing.`,
            });
            return;
        }
        const loan = makeLoanOffer(country, amount, loanWeeks);
        setLoans((prev) => [...prev, loan]);
        setMoney((m) => m + amount);
        setBankNotice({
            type: "success",
            message: `Borrowed ${fmt(amount)} in ${country} at ${(loan.annualRate * 100).toFixed(1)}% — repaying ${fmt(loan.weeklyPayment)}/wk for ${loan.weeks} weeks.`,
        });
    }
    function handleRepayLoan(loanId) {
        const loan = loans.find((l) => l.id === loanId);
        if (!loan)
            return;
        if (loan.outstanding > money) {
            setBankNotice({ type: "fail", message: `You need ${fmt(loan.outstanding)} to clear this loan.` });
            return;
        }
        setMoney((m) => m - loan.outstanding);
        setLoans((prev) => prev.filter((l) => l.id !== loanId));
        setBankNotice({ type: "success", message: `Loan cleared for ${fmt(loan.outstanding)}.` });
    }
    /* -------------------------------- scouts -------------------------------- */
    function handleHireScout(scout) {
        if (myScouts.length >= 5) {
            setScoutNotice({ type: "fail", message: "You can employ five scouts at most." });
            return;
        }
        if (money < scout.wage * 4) {
            setScoutNotice({ type: "fail", message: `You need ${fmt(scout.wage * 4)} to cover his first month.` });
            return;
        }
        setMoney((m) => m - scout.wage * 4);
        setMyScouts((prev) => [...prev, scout]);
        setScoutPool((prev) => prev.filter((sc) => sc.id !== scout.id));
        setScoutNotice({
            type: "success",
            message: `${scout.name} joins as your ${scout.region} scout. He'll turn up better leads and read potential more accurately.`,
        });
    }
    function handleReleaseScout(scoutId) {
        const scout = myScouts.find((sc) => sc.id === scoutId);
        if (!scout)
            return;
        const severance = scout.wage * 4;
        setMoney((m) => m - severance);
        setMyScouts((prev) => prev.filter((sc) => sc.id !== scoutId));
        setScoutPool((prev) => [...prev, scout]);
        setScoutNotice({ type: "success", message: `${scout.name} released for ${fmt(severance)} severance.` });
    }
    /* ------------------------------- releases ------------------------------- */
    /* Dropping a client costs you: a settlement, and a hit to your name. */
    function handleReleaseClient(player) {
        const weeksLeft = Math.max(4, player.contractWeeks || 0);
        const penalty = Math.round(player.wage * ((player.commissionRate ?? 10) / 100) * Math.min(weeksLeft, 26) * 1.5);
        if (penalty > money) {
            setContractNotice({
                type: "fail",
                message: `Terminating ${player.name}'s representation costs ${fmt(penalty)} and you don't have it.`,
            });
            return;
        }
        setMoney((m) => m - penalty);
        setPlayers((prev) => prev.map((p) => p.id === player.id
            ? { ...p, isClient: false, commissionRate: null, endorsement: null, endorsementOffer: null }
            : p));
        setReputation((r) => clamp(r - 2, 1, 100));
        setContractNotice({
            type: "success",
            message: `${player.name} released from your books. Settlement ${fmt(penalty)}, and your reputation takes a 2-point hit.`,
        });
    }
    /* Releasing a club player means paying up his deal. */
    function handleReleaseSquadPlayer(playerId) {
        if (!myClub)
            return;
        const sp = (squads[myClub.id] || []).find((x) => x.id === playerId);
        if (!sp)
            return;
        const severance = Math.round(sp.wage * 26);
        if (myClub.budget < severance) {
            setClubNotice({
                type: "fail",
                message: `Paying up ${sp.name}'s contract costs ${fmt(severance)} and the club can't afford it.`,
            });
            return;
        }
        setClubs((prev) => prev.map((c) => c.id === myClub.id
            ? { ...c, budget: c.budget - severance, wageBill: Math.max(0, c.wageBill - sp.wage) }
            : c));
        setSquads((prev) => ({
            ...prev,
            [myClub.id]: (prev[myClub.id] || []).filter((x) => x.id !== playerId),
        }));
        setClubNotice({
            type: "success",
            message: `${sp.name} released. Severance of ${fmt(severance)} paid, ${fmt(sp.wage)}/wk off the wage bill.`,
        });
    }
    /* ------------------------------- lifestyle ------------------------------- */
    function handleBuyAsset(item) {
        if (money < item.cost || reputation < item.minRep)
            return;
        setMoney((m) => m - item.cost);
        setAssets((prev) => [
            ...prev,
            { ...item, uid: `${item.name}-${Date.now()}`, value: item.cost, boughtFor: item.cost },
        ]);
    }
    function handleSellAsset(uid) {
        const asset = assets.find((a) => a.uid === uid);
        if (!asset)
            return;
        setMoney((m) => m + afterTax(asset.value));
        setAssets((prev) => prev.filter((a) => a.uid !== uid));
        const profit = asset.value - asset.boughtFor;
        setBankNotice({
            type: profit >= 0 ? "success" : "fail",
            message: `Sold ${asset.name} for ${fmt(asset.value)} — ${profit >= 0 ? "a profit" : "a loss"} of ${fmt(Math.abs(profit))} before tax.`,
        });
    }
    /* ------------------------------- affiliates ------------------------------- */
    function handleSetAffiliate(partnerId) {
        if (!myClub)
            return;
        const partner = clubs.find((c) => c.id === partnerId);
        if (!partner)
            return;
        setAffiliates((prev) => ({ ...prev, [myClub.id]: partnerId }));
        setClubNotice({
            type: "success",
            message: `${partner.name} are now a feeder club. You can send young players there for regular football.`,
        });
    }
    function handleLoanOut(playerId) {
        if (!myClub)
            return;
        const partnerId = affiliates[myClub.id];
        const partner = clubs.find((c) => c.id === partnerId);
        const sp = (squads[myClub.id] || []).find((x) => x.id === playerId);
        if (!partner || !sp)
            return;
        setSquads((prev) => ({
            ...prev,
            [myClub.id]: (prev[myClub.id] || []).filter((x) => x.id !== playerId),
            [partner.id]: [...(prev[partner.id] || []), { ...sp, loanedFrom: myClub.id }],
        }));
        setClubNotice({
            type: "success",
            message: `${sp.name} sent on loan to ${partner.name} to get games.`,
        });

    function handleAcceptOffer(offer) {
        if (!myClub)
            return;
        const sp = (squads[myClub.id] || []).find((x) => x.id === offer.playerId);
        if (!sp)
            return;
        setClubs((prev) => prev.map((c) => {
            if (c.id === myClub.id)
                return { ...c, budget: c.budget + offer.fee, wageBill: Math.max(0, c.wageBill - sp.wage) };
            if (c.id === offer.clubId)
                return { ...c, budget: c.budget - offer.fee };
            return c;
        }));
        setSquads((prev) => ({
            ...prev,
            [myClub.id]: (prev[myClub.id] || []).filter((x) => x.id !== offer.playerId),
            [offer.clubId]: [...(prev[offer.clubId] || []), { ...sp, listed: false }],
        }));
        setTransferOffers((prev) => prev.filter((o) => o.playerId !== offer.playerId));
        setClubNotice({
            type: "success",
            message: `${sp.name} sold to ${offer.clubName} for ${fmt(offer.fee)}.`,
        });
    }
    function handleRejectOffer(offerId) {
        setTransferOffers((prev) => prev.filter((o) => o.id !== offerId));
    }
    /* Push for more money — they may improve the bid, hold firm, or walk away. */
    function handleHaggleOffer(offer) {
        const gap = offer.value - offer.fee;
        // The further below value the bid is, the more room there is to push.
        const negotiator = myClub?.technicalDirector;
        const skill = negotiator ? clamp((negotiator.negotiation - 20) / 79, 0, 1) * 0.25 : 0;
        const improveChance = clamp(0.65 - offer.haggled * 0.25 + (gap / offer.value) * 0.3 + skill, 0.08, 0.92);
        const roll = Math.random();
        if (roll < improveChance) {
            const improved = Math.round(offer.fee + gap * (0.3 + Math.random() * 0.4));
            setTransferOffers((prev) => prev.map((o) => (o.id === offer.id ? { ...o, fee: improved, haggled: o.haggled + 1 } : o)));
            setClubNotice({
                type: "success",
                message: `${offer.clubName} improved their bid for ${offer.playerName} to ${fmt(improved)}.`,
            });
        }
        else if (roll < improveChance + 0.25) {
            setTransferOffers((prev) => prev.map((o) => (o.id === offer.id ? { ...o, haggled: o.haggled + 1 } : o)));
            setClubNotice({
                type: "fail",
                message: `${offer.clubName} won't go beyond ${fmt(offer.fee)} for ${offer.playerName}.`,
            });
        }
        else {
            setTransferOffers((prev) => prev.filter((o) => o.id !== offer.id));
            setClubNotice({
                type: "fail",
                message: `${offer.clubName} have walked away from the deal for ${offer.playerName}.`,
            });
        }
    }
    function handleAcceptSponsor(offer) {
        if (!myClub)
            return;
        setClubs((prev) => prev.map((c) => c.id === myClub.id
            ? {
                ...c,
                sponsors: [...(c.sponsors || []).filter((sp) => sp.slot !== offer.slot), { ...offer }],
                // Taking one deal takes the others for that slot off the table.
                sponsorOffers: (c.sponsorOffers || []).filter((o) => o.slot !== offer.slot),
            }
            : c));
        setClubNotice({
            type: "success",
            message: `${offer.brand} signed as ${offer.type.toLowerCase()} for ${fmt(offer.weekly)}/wk.`,
        });
    }
